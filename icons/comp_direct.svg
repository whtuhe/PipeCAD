<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <g fill="none" stroke="#1b2a72" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ================= 1. 居中靠下的竖直管道 ================= -->
    <!-- 顶部开口 -->
    <ellipse cx="150" cy="170" rx="80" ry="25" />
    <!-- 底部开口 -->
    <ellipse cx="150" cy="260" rx="80" ry="25" />
    
    <!-- 左右管壁 -->
    <line x1="70" y1="170" x2="70" y2="260" />
    <line x1="230" y1="170" x2="230" y2="260" />
    
    
    <!-- ================= 2. 60度倾斜的虚线箭头 ================= -->
    
    <!-- 箭头主干 (虚线，严格从管道中心点引出) -->
    <line x1="150" y1="170" x2="230" y2="30" stroke-dasharray="24 18" />
    
    <!-- 箭头头部 (完美对称的 V 型，与 60度 主干精确对齐) -->
    <path d="M 195 45 L 230 30 L 237 70" />
    
  </g>
</svg>