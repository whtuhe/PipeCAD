<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <g fill="none" stroke="#1b2a72" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ================= 1. 中心对齐连线 (置于底层) ================= -->
    <!-- 连接上部管道的底端中心与下部管道的顶端中心 -->
    <line x1="90" y1="110" x2="210" y2="190" stroke-width="12" stroke-dasharray="14 12" />
    
    
    <!-- ================= 2. 上段垂直管道 (偏左) ================= -->
    <g stroke-width="18">
      <!-- 顶部开口 -->
      <ellipse cx="90" cy="40" rx="60" ry="18" />
      <!-- 底部开口 -->
      <ellipse cx="90" cy="110" rx="60" ry="18" />
      <!-- 左右管壁 -->
      <line x1="30" y1="40" x2="30" y2="110" />
      <line x1="150" y1="40" x2="150" y2="110" />
    </g>
    
    
    <!-- ================= 3. 下段垂直管道 (偏右) ================= -->
    <g stroke-width="18">
      <!-- 顶部开口 -->
      <ellipse cx="210" cy="190" rx="60" ry="18" />
      <!-- 底部开口 -->
      <ellipse cx="210" cy="260" rx="60" ry="18" />
      <!-- 左右管壁 -->
      <line x1="150" y1="190" x2="150" y2="260" />
      <line x1="270" y1="190" x2="270" y2="260" />
    </g>
    
  </g>
</svg>