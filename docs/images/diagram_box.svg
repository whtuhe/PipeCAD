<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460">
  <defs>
    <marker id="dimArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c0392b"/>
    </marker>
    <linearGradient id="boxBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aed6f1"/>
      <stop offset="0.5" stop-color="#d6eaf8"/>
      <stop offset="1" stop-color="#aed6f1"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="480" height="460" fill="#ffffff"/>

  <!-- box faces -->
  <!-- top face -->
  <path d="M 110 190 L 310 190 L 380 120 L 180 120 Z" fill="#d6eaf8"/>
  <!-- right face -->
  <path d="M 310 330 L 380 260 L 380 120 L 310 190 Z" fill="#85c1e9"/>
  <!-- front face -->
  <path d="M 110 330 L 310 330 L 310 190 L 110 190 Z" fill="url(#boxBody)"/>

  <!-- hidden edges (back-left-bottom corner), dashed -->
  <path d="M 110 330 L 180 260 M 180 260 L 380 260 M 180 260 L 180 120"
        fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="7 5"/>

  <!-- visible edges -->
  <!-- outer contour -->
  <path d="M 110 330 L 310 330 L 380 260 L 380 120 L 180 120 L 110 190 Z"
        fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- inner edges meeting at the front-top-right corner -->
  <path d="M 310 330 L 310 190 M 310 190 L 110 190 M 310 190 L 380 120"
        fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ===== X-Length dimension (bottom) ===== -->
  <!-- extension lines -->
  <line x1="110" y1="330" x2="110" y2="390" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="310" y1="330" x2="310" y2="390" stroke="#c0392b" stroke-width="1.2"/>
  <!-- dimension line with arrows -->
  <line x1="110" y1="384" x2="310" y2="384" stroke="#c0392b" stroke-width="1.6"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="210" y="370" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"
        fill="#c0392b">X-Length</text>

  <!-- ===== Y-Length dimension (upper-left, along depth) ===== -->
  <!-- extension lines -->
  <line x1="110" y1="190" x2="86" y2="166" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="180" y1="120" x2="156" y2="96" stroke="#c0392b" stroke-width="1.2"/>
  <!-- dimension line with arrows -->
  <line x1="86" y1="166" x2="156" y2="96" stroke="#c0392b" stroke-width="1.6"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="111" y="121" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"
        fill="#c0392b" transform="rotate(-45 111 121)">Y-Length</text>

  <!-- ===== Z-Length dimension (right) ===== -->
  <!-- extension lines -->
  <line x1="380" y1="120" x2="436" y2="120" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="380" y1="260" x2="436" y2="260" stroke="#c0392b" stroke-width="1.2"/>
  <!-- dimension line with arrows -->
  <line x1="430" y1="120" x2="430" y2="260" stroke="#c0392b" stroke-width="1.6"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="446" y="190" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"
        fill="#c0392b" transform="rotate(90 446 190)">Z-Length</text>

</svg>
