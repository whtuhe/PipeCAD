<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" width="480" height="460">
  <defs>
    <marker id="dimArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c0392b"/>
    </marker>
    <linearGradient id="cylBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aed6f1"/>
      <stop offset="0.5" stop-color="#d6eaf8"/>
      <stop offset="1" stop-color="#aed6f1"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="480" height="460" fill="#ffffff"/>

  <!-- cylinder body -->
  <path d="M 100 150 L 100 330 A 110 32 0 0 0 320 330 L 320 150 Z"
        fill="url(#cylBody)" stroke="#2c3e50" stroke-width="2.5"/>
  <!-- bottom hidden (back) arc, dashed -->
  <path d="M 100 330 A 110 32 0 0 1 320 330"
        fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="7 5"/>
  <!-- top ellipse -->
  <ellipse cx="210" cy="150" rx="110" ry="32"
           fill="#d6eaf8" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- center axis (dash-dot) -->
  <line x1="210" y1="108" x2="210" y2="382"
        stroke="#7f8c8d" stroke-width="1.3" stroke-dasharray="14 5 3 5"/>

  <!-- ===== Diameter dimension (top) ===== -->
  <!-- extension lines from ellipse widest points -->
  <line x1="100" y1="150" x2="100" y2="88" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="320" y1="150" x2="320" y2="88" stroke="#c0392b" stroke-width="1.2"/>
  <!-- dimension line with arrows -->
  <line x1="100" y1="94" x2="320" y2="94" stroke="#c0392b" stroke-width="1.6"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="210" y="80" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"
        fill="#c0392b">Diameter</text>

  <!-- ===== Height dimension (right) ===== -->
  <!-- extension lines -->
  <line x1="320" y1="150" x2="398" y2="150" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="320" y1="330" x2="398" y2="330" stroke="#c0392b" stroke-width="1.2"/>
  <!-- dimension line with arrows -->
  <line x1="390" y1="150" x2="390" y2="330" stroke="#c0392b" stroke-width="1.6"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="404" y="240" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold"
        fill="#c0392b" transform="rotate(90 404 240)">Height</text>

</svg>
